name: CI
on:
  workflow_dispatch:
env:
  TINY_CUDA_NN_VERSION: "1.7.3"
jobs:

  build-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Install GitHub CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y gh

      - name: Create Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN  }}
        with:
          tag_name: ${{ env.TINY_CUDA_NN_VERSION }}
          release_name: ${{ env.TINY_CUDA_NN_VERSION }}
          draft: false
          prerelease: false

  build_linux:
    # needs: build-tag
    runs-on: ${{ matrix.os }}
    container:
      image: ${{ matrix.cuda-image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Tier 1: CUDA 12.4 · PyTorch 2.6.0 · Python 3.12 ──────────────
          # Covers Kaggle (P100, T4), Colab Pro (A100), modern workstations
          - os: ubuntu-22.04
            cuda-image: nvidia/cuda:12.4.0-devel-ubuntu22.04
            cudaversion: 124
            torch-version: "2.6.0"
            torchversion: 260
            python-version: "3.12"
            arch: 60   # P100 (Kaggle)
          - os: ubuntu-22.04
            cuda-image: nvidia/cuda:12.4.0-devel-ubuntu22.04
            cudaversion: 124
            torch-version: "2.6.0"
            torchversion: 260
            python-version: "3.12"
            arch: 75   # T4 (Colab free, Kaggle)
          - os: ubuntu-22.04
            cuda-image: nvidia/cuda:12.4.0-devel-ubuntu22.04
            cudaversion: 124
            torch-version: "2.6.0"
            torchversion: 260
            python-version: "3.12"
            arch: 80   # A100 (Colab Pro, AWS p4)
          - os: ubuntu-22.04
            cuda-image: nvidia/cuda:12.4.0-devel-ubuntu22.04
            cudaversion: 124
            torch-version: "2.6.0"
            torchversion: 260
            python-version: "3.12"
            arch: 86   # RTX 3060–3090, A40, RunPod
          - os: ubuntu-22.04
            cuda-image: nvidia/cuda:12.4.0-devel-ubuntu22.04
            cudaversion: 124
            torch-version: "2.6.0"
            torchversion: 260
            python-version: "3.12"
            arch: 89   # L4 (Lightning AI), RTX 4070–4090, Colab Pro+

          # ── Tier 2: CUDA 12.4 · PyTorch 2.6.0 · Python 3.11 ──────────────
          # Covers Google Colab free tier (Python 3.11 default as of 2025)
          - os: ubuntu-22.04
            cuda-image: nvidia/cuda:12.4.0-devel-ubuntu22.04
            cudaversion: 124
            torch-version: "2.6.0"
            torchversion: 260
            python-version: "3.11"
            arch: 75   # T4 (Colab free)
          - os: ubuntu-22.04
            cuda-image: nvidia/cuda:12.4.0-devel-ubuntu22.04
            cudaversion: 124
            torch-version: "2.6.0"
            torchversion: 260
            python-version: "3.11"
            arch: 80   # A100 (Colab Pro)
          - os: ubuntu-22.04
            cuda-image: nvidia/cuda:12.4.0-devel-ubuntu22.04
            cudaversion: 124
            torch-version: "2.6.0"
            torchversion: 260
            python-version: "3.11"
            arch: 86   # RTX 3xxx, Lambda Labs A10
          - os: ubuntu-22.04
            cuda-image: nvidia/cuda:12.4.0-devel-ubuntu22.04
            cudaversion: 124
            torch-version: "2.6.0"
            torchversion: 260
            python-version: "3.11"
            arch: 89   # L4, RTX 4xxx

          # ── Tier 1b: CUDA 12.4 · PyTorch 2.6.0 · Python 3.13 ─────────────
          # Covers newer Ubuntu installs, forward-looking users
          - os: ubuntu-22.04
            cuda-image: nvidia/cuda:12.4.0-devel-ubuntu22.04
            cudaversion: 124
            torch-version: "2.6.0"
            torchversion: 260
            python-version: "3.13"
            arch: 75
          - os: ubuntu-22.04
            cuda-image: nvidia/cuda:12.4.0-devel-ubuntu22.04
            cudaversion: 124
            torch-version: "2.6.0"
            torchversion: 260
            python-version: "3.13"
            arch: 80
          - os: ubuntu-22.04
            cuda-image: nvidia/cuda:12.4.0-devel-ubuntu22.04
            cudaversion: 124
            torch-version: "2.6.0"
            torchversion: 260
            python-version: "3.13"
            arch: 86
          - os: ubuntu-22.04
            cuda-image: nvidia/cuda:12.4.0-devel-ubuntu22.04
            cudaversion: 124
            torch-version: "2.6.0"
            torchversion: 260
            python-version: "3.13"
            arch: 89

          # ── Tier 3: CUDA 12.8 · PyTorch 2.8.0 · Python 3.12 ──────────────
          # Covers Lightning AI studios, newer cloud installs
          - os: ubuntu-22.04
            cuda-image: nvidia/cuda:12.8.1-devel-ubuntu22.04
            cudaversion: 128
            torch-version: "2.8.0"
            torchversion: 280
            python-version: "3.12"
            arch: 86   # RTX 3xxx
          - os: ubuntu-22.04
            cuda-image: nvidia/cuda:12.8.1-devel-ubuntu22.04
            cudaversion: 128
            torch-version: "2.8.0"
            torchversion: 280
            python-version: "3.12"
            arch: 89   # L4, RTX 4xxx
          - os: ubuntu-22.04
            cuda-image: nvidia/cuda:12.8.1-devel-ubuntu22.04
            cudaversion: 128
            torch-version: "2.8.0"
            torchversion: 280
            python-version: "3.12"
            arch: 90   # H100

          # ── Tier 3b: CUDA 12.8 · PyTorch 2.8.0 · Python 3.13 ─────────────
          - os: ubuntu-22.04
            cuda-image: nvidia/cuda:12.8.1-devel-ubuntu22.04
            cudaversion: 128
            torch-version: "2.8.0"
            torchversion: 280
            python-version: "3.13"
            arch: 86
          - os: ubuntu-22.04
            cuda-image: nvidia/cuda:12.8.1-devel-ubuntu22.04
            cudaversion: 128
            torch-version: "2.8.0"
            torchversion: 280
            python-version: "3.13"
            arch: 89
          - os: ubuntu-22.04
            cuda-image: nvidia/cuda:12.8.1-devel-ubuntu22.04
            cudaversion: 128
            torch-version: "2.8.0"
            torchversion: 280
            python-version: "3.13"
            arch: 90

    env:
      build_dir: "build"
      config: "Release"
      TCNN_CUDA_ARCHITECTURES: ${{ matrix.arch }}
    steps:
      - name: Install Git and Python
        run: |
          apt-get update
          apt-get install -y git python3 python3-pip curl

      - name: Install Python ${{ matrix.python-version }}
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y software-properties-common
          add-apt-repository ppa:deadsnakes/ppa -y
          apt-get update
          apt-get install -y python${{ matrix.python-version }} python${{ matrix.python-version }}-venv

      - name: Install Python ${{ matrix.python-version }} development headers
        run: |
          apt-get update
          apt-get install -y python${{ matrix.python-version }}-dev

      - name: Install pip for Python ${{ matrix.python-version }}
        run: |
          curl -sS https://bootstrap.pypa.io/get-pip.py -o get-pip.py
          python${{ matrix.python-version }} get-pip.py
          python${{ matrix.python-version }} -m pip install --upgrade pip "setuptools<81" wheel
          rm get-pip.py

      - name: Install GitHub CLI
        run: |
          apt-get update
          apt-get install -y gh

      - uses: actions/checkout@v3
        with:
          repository: 'NVlabs/tiny-cuda-nn'
          submodules: 'recursive'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: List directory structure
        run: |
          ls -R
      - name: Install Wheel
        run:
          python${{ matrix.python-version }} -m pip install "setuptools<81" wheel
      - name: Install PyTorch ${{ matrix.torch-version }} (cu${{ matrix.cudaversion }}) and NumPy
        run: |
          python${{ matrix.python-version }} -m pip install torch==${{ matrix.torch-version }} --index-url https://download.pytorch.org/whl/cu${{ matrix.cudaversion }}
          python${{ matrix.python-version }} -m pip install "numpy>=2.0.0"
      - name: Generate Wheels
        run: |
          cd bindings/torch
          python${{ matrix.python-version }} setup.py bdist_wheel --plat-name linux_x86_64
        env:
          INCLUDE_ARCH: ${{ matrix.arch }}

      - name: List generated wheels
        run: |
          echo "Checking for generated wheels..."
          ls -la bindings/torch/dist/ || echo "dist directory does not exist"
          if [ -d "bindings/torch/dist" ]; then
            echo "Files in dist directory:"
            ls -lh bindings/torch/dist/
          fi

      - name: Verify release exists
        run: |
          echo "Checking if release ${{ env.TINY_CUDA_NN_VERSION }} exists..."
          gh release view ${{ env.TINY_CUDA_NN_VERSION }} --repo ${{ github.repository }} || echo "Release does not exist yet, will be created on first upload"

      - name: Upload assets
        run: |
          cd bindings/torch/dist
          if [ ! -d . ] || [ -z "$(ls -A . 2>/dev/null)" ]; then
            echo "Error: No files found in bindings/torch/dist"
            exit 1
          fi
          wheel_count=0
          for filename in *.whl; do
            if [ ! -f "$filename" ]; then
              continue
            fi
            wheel_count=$((wheel_count + 1))
            echo "Processing wheel file: $filename"
            new_filename=$(echo "$filename" | sed "s/\(tinycudann-[0-9]\+\.[0-9]\+\)/\1.post${{ matrix.arch }}${{ matrix.torchversion }}${{ matrix.cudaversion }}/")
            if [ "$filename" != "$new_filename" ]; then
              echo "Renaming $filename to $new_filename"
              mv "$filename" "$new_filename"
            else
              echo "Warning: Filename pattern did not match, using original: $filename"
              new_filename="$filename"
            fi
            echo "Uploading $new_filename to release ${{ env.TINY_CUDA_NN_VERSION }}"
            if gh release upload ${{ env.TINY_CUDA_NN_VERSION }} "$new_filename" --clobber --repo ${{ github.repository }}; then
              echo "✓ Successfully uploaded $new_filename"
            else
              echo "✗ Failed to upload $new_filename"
              exit 1
            fi
          done
          if [ $wheel_count -eq 0 ]; then
            echo "Error: No .whl files found in bindings/torch/dist"
            echo "Contents of dist directory:"
            ls -la
            exit 1
          fi
          echo "Uploaded $wheel_count wheel file(s)"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
